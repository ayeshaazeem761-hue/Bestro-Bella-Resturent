<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:#0a0a0a;color:#fff}
  header{background:#000;border-bottom:2px solid #d4af37;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
  .logo{font-size:26px;font-weight:900;letter-spacing:1px;color:#d4af37}
  .logo span{color:#fff;font-weight:400}
  nav a{color:#fff;text-decoration:none;margin-left:22px;font-weight:600;font-size:15px}
  nav a:hover{color:#d4af37}
  .hero{background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1200');background-size:cover;background-position:center;height:82vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
  .hero small{color:#d4af37;letter-spacing:3px;font-weight:700}
  .hero h1{font-size:58px;line-height:1.05;margin:12px 0}
  .hero h1 span{color:#d4af37}
  .hero p{max-width:580px;color:#ddd;font-size:17px;margin-bottom:25px;line-height:1.6}
  .btn{background:#d4af37;color:#000;padding:14px 30px;border:none;border-radius:30px;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}
  .btn:hover{background:#fff}
  .btn-outline{background:transparent;color:#d4af37;border:2px solid #d4af37;padding:12px 28px;border-radius:30px;font-weight:700;text-decoration:none;margin-left:10px}
  .section{padding:65px 5%;text-align:center}
  .section h2{font-size:38px}
  .section h2 span{color:#d4af37}
  .sub{color:#aaa;margin:10px 0 35px}
  .menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
  .card{background:#161616;border:1px solid #2a2a2a;border-radius:20px;overflow:hidden;text-align:left;transition:.3s}
  .card:hover{border-color:#d4af37;transform:translateY(-5px)}
  .card img{width:100%;height:220px;object-fit:cover}
  .card-body{padding:20px}
  .tag{background:#d4af37;color:#000;font-size:12px;font-weight:800;padding:5px 10px;border-radius:20px}
  .card-body h3{font-size:24px;margin:12px 0 6px}
  .card-body p{color:#bbb;font-size:14px;line-height:1.6}
  .price-row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
  .price{font-size:22px;font-weight:900;color:#d4af37}
  .price s{font-size:14px;color:#777;font-weight:400}
  .order{background:#d4af37;border:none;padding:10px 18px;border-radius:25px;font-weight:800;cursor:pointer}
  .about{background:#111;border-top:1px solid #222;border-bottom:1px solid #222;display:flex;gap:30px;align-items:center;text-align:left;flex-wrap:wrap;padding:60px 5%}
  .about img{width:100%;max-width:460px;border-radius:18px;border:2px solid #d4af37}
  .about div{flex:1;min-width:280px}
  .about h2{font-size:34px;margin-bottom:12px}
  .about p{color:#bbb;line-height:1.8}
  .info{margin-top:18px;line-height:2}
  .info b{color:#d4af37}
  .reserve{max-width:600px;margin:0 auto;background:#161616;border:1px solid #d4af37;border-radius:20px;padding:30px}
  .reserve input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#000;color:#fff;outline:none}
  .reserve input:focus{border-color:#d4af37}
  footer{text-align:center;padding:25px;background:#000;border-top:2px solid #d4af37;color:#888}
  footer b{color:#d4af37}
  @media(max-width:600px){.hero h1{font-size:38px} nav{display:none}}
</style>
